name: agent-stylist

on:
  schedule:
    # 45 min after the contributor (45 14 * * *) to avoid overlap.
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      goal:
        description: 'Goal override (leave blank to use the default stylist goal)'
        required: false
        type: string

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-stylist
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Run stylist agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          # Stylist-specific agent ID. Janitor uses AGGREGATOR_AGENT_ID;
          # contributor uses AGGREGATOR_CONTRIBUTOR_AGENT_ID.
          AGGREGATOR_AGENT_ID: ${{ secrets.AGGREGATOR_STYLIST_AGENT_ID }}
          AGGREGATOR_ENV_ID: ${{ secrets.AGGREGATOR_ENV_ID }}
          GITHUB_REPO_TOKEN: ${{ secrets.AGENT_GITHUB_PAT }}
          AGENT_VARIANT: stylist
          GITHUB_REPO_URL: https://github.com/${{ github.repository }}
          GOAL_INPUT: ${{ inputs.goal }}
        run: |
          GOAL="${GOAL_INPUT:-$(cat docs/agent-goal-stylist.md)}"
          npx tsx scripts/run-site-agent.mts "$GOAL"
