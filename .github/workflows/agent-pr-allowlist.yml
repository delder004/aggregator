name: agent-pr-allowlist

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  check:
    # Only enforce on PRs from agent/* branches. Other PRs are authored by
    # humans and should pass without running this check.
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce file allowlist
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          changed=$(git diff --name-only origin/main...HEAD)
          echo "Files changed in this PR:"
          echo "$changed"
          echo "Branch: $HEAD_REF"
          echo "---"

          # Universal forbids — apply to every agent/* branch.
          forbidden=$(echo "$changed" | grep -E '^(wrangler\.toml|CLAUDE\.md|\.github/.*|src/db/.*\.sql)$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Agent PRs cannot modify infra files. Forbidden paths touched:"
            echo "$forbidden"
            echo ""
            echo "If this change genuinely needs to land, a human should open a new PR from a non-agent/* branch."
            exit 1
          fi

          # Stylist-only forbids — pipeline and data-layer code is off-limits
          # to the stylist agent. Renderer-only design changes belong on
          # agent/stylist-* branches; correctness/data work belongs to the
          # janitor (agent/<other>) or to a human PR.
          if [[ "$HEAD_REF" == agent/stylist-* ]]; then
            stylist_forbidden=$(echo "$changed" | grep -E '^(src/collectors/.*|src/scoring/.*|src/db/.*|src/index\.ts)$' || true)
            if [ -n "$stylist_forbidden" ]; then
              echo "::error::Stylist PRs cannot modify pipeline/data-layer code. Forbidden paths touched:"
              echo "$stylist_forbidden"
              echo ""
              echo "Stylist scope is the renderer (src/renderer/**) and docs/design-roadmap.md only."
              echo "If this change genuinely needs to land, a human should open a new PR from a non-agent/* branch,"
              echo "or route the work through the janitor or contributor agent."
              exit 1
            fi
          fi

          echo "OK — PR stays within allowed paths."
