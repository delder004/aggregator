name: agent-pr-allowlist

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  check:
    # Only enforce on PRs from agent/* branches. Other PRs are authored by
    # humans and should pass without running this check.
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce file allowlist
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          changed=$(git diff --name-only origin/main...HEAD)
          echo "Files changed in this PR:"
          echo "$changed"
          echo "Branch: $HEAD_REF"
          echo "---"

          # Universal forbids — apply to every agent/* branch.
          forbidden=$(echo "$changed" | grep -E '^(wrangler\.toml|CLAUDE\.md|\.github/.*|src/db/.*\.sql)$' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Agent PRs cannot modify infra files. Forbidden paths touched:"
            echo "$forbidden"
            echo ""
            echo "If this change genuinely needs to land, a human should open a new PR from a non-agent/* branch."
            exit 1
          fi

          # Stylist allowlist — the stylist agent's scope is the renderer and
          # the design roadmap, nothing else. Anything outside that set is
          # rejected, even if the universal forbids above would allow it.
          # If a stylist change genuinely needs to touch other paths, a human
          # should open the PR, or the work should be routed through the
          # janitor or contributor agent.
          if [[ "$HEAD_REF" == agent/stylist-* ]]; then
            out_of_scope=$(echo "$changed" | grep -vE '^(src/renderer/.*|docs/design-roadmap\.md)$' || true)
            if [ -n "$out_of_scope" ]; then
              echo "::error::Stylist PRs may only modify src/renderer/** and docs/design-roadmap.md. Out-of-scope paths touched:"
              echo "$out_of_scope"
              exit 1
            fi
          fi

          echo "OK — PR stays within allowed paths."
